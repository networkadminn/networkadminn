[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timetrack"
version = "0.1.0"
description = "Cross-platform time & activity tracker (DeskTime-style, self-hosted)"
readme = "TIMETRACK.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "networkadminn" }]
dependencies = [
    "Flask>=3.0.0",
    "psutil>=5.9.0",
    "tzdata>=2024.1",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "SQLAlchemy>=2.0.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.0",
    "pywin32>=306; platform_system == 'Windows'",
    "pyobjc-framework-Quartz>=10.0; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
timetrack = "timetrack.__main__:main"
timetrack-agent = "timetrack.agent.__main__:main"
timetrack-server = "timetrack.server.__main__:main"

[tool.setuptools.packages.find]
include = ["timetrack*"]

[tool.setuptools.package-data]
timetrack = [
    "dashboard/templates/*",
    "dashboard/static/*",
    "server/templates/*",
    "server/static/*",
]
