# Build Linux (.deb for Ubuntu 22.04 + 24.04) and Windows installers, then upload to production.
#
# Triggers: push tag v* (build + deploy), or manual run (build; optional deploy).
#
# Repository secret (required for deploy):
#   PRODUCTION_SSH_KEY — contents of server-key.pem (root@31.97.239.250)
#
name: Client release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload builds to tracker production server
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux deb (Ubuntu ${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 \
            libayatana-appindicator3-1 gir1.2-ayatanaappindicator3-0.1 \
            libnotify-bin python3-tk python3-venv tk-dev dpkg-dev fakeroot xvfb \
            xprintidle xdotool libxss1 gnome-screenshot

      - name: Python packages
        run: |
          python -m pip install -q -U pip wheel
          python -m pip install -q -r requirements.txt "pyinstaller>=6.0" Pillow "PyGObject<3.51" pycairo

      - name: Build .deb
        env:
          ESSTRACKER_DEB_TAG: ubuntu${{ matrix.ubuntu }}
        run: python packaging/build.py deb

      - name: Check package and binary
        run: |
          ls -la dist/*.deb dist/releases/
          dpkg-deb -I dist/esstracker_*_ubuntu${{ matrix.ubuntu }}_amd64.deb | head -20
          dpkg-deb -c dist/esstracker_*_ubuntu${{ matrix.ubuntu }}_amd64.deb | grep -q linux_screenshot.py
          readlink build/deb/esstracker_*/opt/esstracker/venv/bin/python | grep -q '/usr/bin/python3'
          xvfb-run -a dist/linux/timetrack-agent --help >/dev/null
          echo "binary starts OK"

      - name: Install, run and remove the .deb
        run: |
          set -euo pipefail
          deb=$(ls dist/esstracker_*_ubuntu${{ matrix.ubuntu }}_amd64.deb)
          sudo apt-get install -y -qq "./$deb"
          dpkg -s esstracker | grep -E '^(Status|Version):'
          command -v esstracker-agent
          xvfb-run -a esstracker-agent --help >/dev/null
          xvfb-run -a esstracker-agent status
          # The tray agent must start and stay up (it waits on the sign-in window here).
          xvfb-run -a timeout 20 esstracker-agent run && rc=0 || rc=$?
          if [ "$rc" -ne 124 ]; then echo "::error::agent exited early (rc=$rc)"; exit 1; fi
          echo "agent ran 20 s without crashing"
          sudo apt-get remove -y -qq esstracker
          ! command -v esstracker-agent
          sha256sum "$deb" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu${{ matrix.ubuntu }}
          path: |
            dist/esstracker_*_ubuntu${{ matrix.ubuntu }}_amd64.deb
            dist/releases/esstracker_*_ubuntu${{ matrix.ubuntu }}_amd64.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Load code-signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "esstracker-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          "ESSTRACKER_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build client + installer
        shell: pwsh
        env:
          ESSTRACKER_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Check installer exists
        shell: pwsh
        run: |
          Get-ChildItem dist\releases\esstracker-Setup-*.exe, dist\releases\esstracker-*-windows.zip | Format-Table Name, Length

      - name: Install, run and uninstall (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist\releases\esstracker-Setup-*.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\esstracker'
          $exe = Join-Path $app 'esstracker-Agent.exe'
          foreach ($f in @($exe, "$app\_internal", "$app\defaults.toml", "$app\unins000.exe")) {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          $vi = (Get-Item $exe).VersionInfo
          "Company: $($vi.CompanyName) | Product: $($vi.ProductName) | Version: $($vi.FileVersion)"
          if (-not $vi.CompanyName) { throw "agent exe has no version/publisher info" }
          "Signature: $((Get-AuthenticodeSignature $exe).Status)"

          $s = Start-Process $exe -ArgumentList 'status' -Wait -PassThru -WindowStyle Hidden
          if ($s.ExitCode -ne 0) { throw "esstracker-Agent.exe status exit code $($s.ExitCode)" }

          # The tray agent must start and stay up (it waits on the sign-in window here).
          $run = Start-Process $exe -ArgumentList 'run' -PassThru
          Start-Sleep -Seconds 20
          if ($run.HasExited) { throw "agent exited early with code $($run.ExitCode)" }
          "agent ran 20 s without crashing"
          Stop-Process -Id $run.Id -Force

          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          "uninstall removed the app"

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $status = try { Get-MpComputerStatus } catch { $null }
          if (-not (Test-Path $mp) -or -not $status -or -not $status.AntivirusEnabled) {
            "::warning::Microsoft Defender is not active on this runner; scan skipped"
            exit 0
          }
          try { Update-MpSignature -ErrorAction Stop } catch { "signature update failed: $_" }
          $bad = 0
          foreach ($f in @((Get-ChildItem dist\releases\esstracker-Setup-*.exe)[0].FullName, (Resolve-Path dist\windows).Path)) {
            & $mp -Scan -ScanType 3 -File $f -DisableRemediation
            if ($LASTEXITCODE -eq 2) { "::error::Defender flagged $f"; $bad++ }
          }
          if ($bad) { exit 1 }
          "Defender: no threats found" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        env:
          # Partner Center > Product identity; placeholders are used until these repo variables exist.
          ESSTRACKER_MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          ESSTRACKER_MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          ESSTRACKER_MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: .venv\Scripts\python.exe packaging\build.py msix

      - name: Install, run and remove the MSIX (test-signed copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msix = (Get-ChildItem dist\releases\esstracker-*-x64.msix)[0].FullName
          [xml]$m = Get-Content build\msix\AppxManifest.xml
          $publisher = $m.Package.Identity.Publisher
          $name = $m.Package.Identity.Name

          # Sideloading needs a trusted signature; the Store signs the real package itself.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -FriendlyName "esstracker MSIX test" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "test" -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "msix-test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          $cer = Join-Path $env:RUNNER_TEMP "msix-test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          $test = Join-Path $env:RUNNER_TEMP "esstracker-test.msix"
          Copy-Item $msix $test
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p test $test
          if ($LASTEXITCODE -ne 0) { throw "test signing failed" }

          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name $name
          if (-not $pkg) { throw "package $name not installed" }
          "Installed: $($pkg.PackageFullName)"

          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\esstracker-agent.exe"
          if (-not (Test-Path $alias)) { throw "execution alias missing: $alias" }
          $s = Start-Process $alias -ArgumentList 'status' -Wait -PassThru -WindowStyle Hidden
          if ($s.ExitCode -ne 0) { throw "packaged agent status exit code $($s.ExitCode)" }

          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!esstracker"
          Start-Sleep -Seconds 20
          $proc = Get-Process -Name "esstracker-Agent" -ErrorAction SilentlyContinue
          if (-not $proc) { throw "packaged agent is not running 20 s after launch" }
          "packaged agent ran 20 s without crashing"
          $proc | Stop-Process -Force

          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name $name) { throw "package still installed after removal" }
          "MSIX removed cleanly"

      - name: Windows App Certification Kit (Store pre-check)
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { "::warning::App Certification Kit not installed on this runner; skipped"; exit 0 }
          $msix = (Get-ChildItem dist\releases\esstracker-*-x64.msix)[0].FullName
          New-Item -ItemType Directory -Force dist\wack | Out-Null
          & $appcert reset
          & $appcert test -appxpackagepath $msix -reportoutputpath dist\wack\wack-report.xml
          if (Test-Path dist\wack\wack-report.xml) {
            [xml]$r = Get-Content dist\wack\wack-report.xml
            "WACK overall result: $($r.REPORT.OVERALL_RESULT)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            $r.SelectNodes("//TEST[RESULT='FAIL']") | ForEach-Object { "FAIL: $($_.NAME)" } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-store
          path: |
            dist/releases/esstracker-*-x64.msix
            dist/wack/
          if-no-files-found: warn

      - name: SHA-256 of files to share
        shell: pwsh
        run: |
          Get-ChildItem dist\releases\esstracker-Setup-*.exe, dist\releases\esstracker-*-windows.zip |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/releases/esstracker-Setup-*.exe
            dist/releases/esstracker-*-windows.zip
          if-no-files-found: error

  deploy-server:
    name: Deploy to production
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p staging
          find artifacts -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | xargs -0 -I{} cp -v {} staging/
          ls -la staging/
          test "$(ls -1 staging/*.deb 2>/dev/null | wc -l)" -ge 2
          test -n "$(ls staging/esstracker-Setup-*.exe 2>/dev/null)"

      - name: Upload to tracker server
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "${SSH_KEY}" ]; then
            echo "PRODUCTION_SSH_KEY secret is not set — skip deploy"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production.pem
          chmod 600 ~/.ssh/production.pem
          ssh -i ~/.ssh/production.pem -o StrictHostKeyChecking=accept-new -p 22 \
            root@31.97.239.250 'mkdir -p /www/wwwroot/timetrack/data/releases'
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/production.pem -o StrictHostKeyChecking=accept-new -p 22" \
            staging/ root@31.97.239.250:/www/wwwroot/timetrack/data/releases/
          ssh -i ~/.ssh/production.pem -p 22 root@31.97.239.250 \
            'ls -la /www/wwwroot/timetrack/data/releases/ | tail -20'

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
