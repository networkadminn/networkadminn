name: macOS dmg

# macOS only; Linux/Windows/server deploy: client-release.yml
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MAC_NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: |
          python3 -m pip install -q -U pip wheel
          python3 -m pip install -q -r requirements.txt "pyinstaller>=6.0" Pillow

      # Optional: Developer ID signing keeps Gatekeeper quiet and keeps the Screen
      # Recording permission across updates. Without these secrets the app is
      # ad-hoc signed (works, but users get warnings and must re-grant after updates).
      - name: Import Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/esstracker-sign.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "ESSTRACKER_MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials esstracker-notary \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
          echo "ESSTRACKER_MAC_NOTARY_PROFILE=esstracker-notary" >> "$GITHUB_ENV"

      - name: Build DMG
        run: bash packaging/build_mac.sh

      - name: Check DMG
        run: |
          ls -la dist/releases/*.dmg
          test -s dist/releases/esstracker-*-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: esstracker-macos-${{ matrix.arch }}
          path: dist/releases/esstracker-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # One job attaches both DMGs, so the two matrix legs don't race to create the release.
  release:
    needs: build
    # Still publish the DMG that did build if one architecture failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: esstracker-macos-*
          merge-multiple: true
          path: dmg

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
