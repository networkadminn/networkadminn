name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra version tag (e.g. 0.3.19). Always also pushes :latest"
        required: false
        default: ""
  push:
    branches: [main, "release/**"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "pyproject.toml"
      - "TIMETRACK.md"
      - "timetrack/**"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          VER=$(python3 -c "import pathlib; t=pathlib.Path('timetrack/__init__.py').read_text(); import re; print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t).group(1))")
          EXTRA="${{ github.event.inputs.tag }}"
          TAGS="euclidee/esstracker-server:latest,euclidee/esstracker-server:${VER}"
          if [ -n "$EXTRA" ] && [ "$EXTRA" != "$VER" ]; then
            TAGS="${TAGS},euclidee/esstracker-server:${EXTRA}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
