name: Windows installer

# Prefer .github/workflows/client-release.yml (builds 22.04 + 24.04 + Windows + server deploy).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Load code-signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "esstracker-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          "ESSTRACKER_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build client + installer
        shell: pwsh
        env:
          ESSTRACKER_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Probe browser URL capture (Edge)
        shell: pwsh
        run: .venv\Scripts\python.exe packaging\windows\probe_url.py https://example.com/esstracker-probe

      - name: Check installer exists
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\releases\esstracker-Setup-*.exe
          if (-not $f) { throw "installer missing" }
          $f | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: esstracker-windows
          path: |
            dist/releases/esstracker-Setup-*.exe
            dist/releases/esstracker-*-windows.zip
          if-no-files-found: error
