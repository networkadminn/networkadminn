{# CSS/SVG loop — GIF-style hero when no login-hero.webm is in static/brand/ #}
<div class="login-hero-loop" aria-hidden="true">
  <div class="login-loop-scene">
    <div class="login-loop-desk"></div>
    <div class="login-loop-laptop">
      <span class="login-loop-screen"></span>
      <span class="login-loop-key glow"></span>
      <span class="login-loop-key"></span>
      <span class="login-loop-key delay"></span>
    </div>
    <div class="login-loop-mug">
      <span class="login-loop-steam s1"></span>
      <span class="login-loop-steam s2"></span>
      <span class="login-loop-steam s3"></span>
    </div>
    <div class="login-loop-clock" title="">
      <span class="login-loop-hand hour"></span>
      <span class="login-loop-hand min"></span>
    </div>
    <div class="login-loop-bar-wrap">
      <span class="login-loop-bar-label">Today</span>
      <div class="login-loop-bar"><i></i></div>
    </div>
  </div>
</div>
