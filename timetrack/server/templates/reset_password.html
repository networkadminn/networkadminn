{% extends "base.html" %}
{% block title %}Choose new password · timeforge{% endblock %}
{% block body %}
<div class="login-page">
  <section class="login-hero" aria-label="timeforge">
    <div class="login-hero-inner">
      <div class="login-hero-brand">
        <img class="login-logo" src="{{ url_for('static', filename='brand/timeforge-logo.png') }}" alt="Timeforge" />
      </div>
      <p class="login-product">timeforge</p>
      <h1>Set a new password.</h1>
      <p>Choose something only you know — at least 6 characters.</p>
    </div>
  </section>
  <section class="login-panel">
    <div class="login-card">
      <img class="login-mark" src="{{ url_for('static', filename='brand/timeforge-mark.png') }}" alt="" />
      <p class="login-kicker">Timeforge</p>
      <h2>New password</h2>
      <form method="post" class="login-form">
        <label>New password
          <input type="password" name="password" required minlength="6"
                 autocomplete="new-password" placeholder="••••••••" />
        </label>
        <label>Confirm password
          <input type="password" name="confirm" required minlength="6"
                 autocomplete="new-password" placeholder="••••••••" />
        </label>
        <button class="btn primary" type="submit">Update password</button>
      </form>
      <p class="login-foot">
        <a href="{{ url_for('auth.login') }}">← Back to sign in</a>
      </p>
    </div>
  </section>
</div>
{% endblock %}
