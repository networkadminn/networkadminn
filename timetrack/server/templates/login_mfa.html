{% extends "base.html" %}
{% block title %}Two-factor authentication &middot; TimeTrack{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="logo">&#9200;</span> TimeTrack</div>
    <p class="login-sub">Enter the 6-digit code from your authenticator app for <strong>{{ username }}</strong></p>
    <form method="post" class="login-form">
      <label>Authentication code
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]*"
               autocomplete="one-time-code" autofocus required maxlength="6" />
      </label>
      <button class="btn primary" type="submit">Verify</button>
    </form>
    <p class="login-sub"><a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a></p>
  </div>
</div>
{% endblock %}
