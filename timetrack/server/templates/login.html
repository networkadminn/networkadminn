{% extends "base.html" %}
{% block title %}Sign in &middot; TimeTrack{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="logo">&#9200;</span> TimeTrack</div>
    <p class="login-sub">Sign in to your workspace</p>
    <form method="post" class="login-form">
      {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
      <label>Username
        <input type="text" name="username" autofocus required autocomplete="username" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
