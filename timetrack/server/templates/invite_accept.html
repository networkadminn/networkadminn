{% extends "base.html" %}
{% block title %}Accept invite · timeforge{% endblock %}
{% block body %}
<div class="login-page">
  <section class="login-panel" style="margin:auto">
    <div class="login-card">
      <img class="login-mark" src="{{ url_for('static', filename='brand/timeforge-mark.png') }}" alt="" />
      <p class="login-kicker">{{ org.name }}</p>
      <h2>Join the workspace</h2>
      <p class="login-sub">Invited as <strong>{{ email }}</strong>. Choose a username and password.</p>
      <form method="post" class="login-form">
        <label>Display name
          <input type="text" name="display_name" value="{{ display_name }}" placeholder="Your name" />
        </label>
        <label>Username
          <input type="text" name="username" required autocomplete="username" placeholder="alice" />
        </label>
        <label>Password
          <input type="password" name="password" required minlength="6" autocomplete="new-password" />
        </label>
        <label>Confirm password
          <input type="password" name="confirm" required minlength="6" autocomplete="new-password" />
        </label>
        <button class="btn primary" type="submit">Join {{ org.name }}</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
